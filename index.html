<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HYDFLEX – MIARKA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#f4f7fb;font-family:Arial,sans-serif;padding:16px}
h1{text-align:center;font-size:30px;margin:8px 0 18px}.card{background:#121922;border-radius:28px;padding:22px;margin-bottom:16px}
.label{font-size:17px;color:#aeb9c7;letter-spacing:1px}.value{text-align:center;font-size:86px;font-weight:700;margin:18px 0 4px}
.unit{font-size:30px;color:#aeb9c7}.pulses{text-align:center;font-size:20px;color:#aeb9c7}
button{border:0;border-radius:20px;padding:18px 20px;font-size:22px;font-weight:700;color:white;background:#26354a;min-height:64px}
.connect{width:100%;background:#2675e8;font-size:23px}.status{text-align:center;margin-top:12px;color:#aeb9c7;min-height:24px}
.connected{color:#55df7a}.error{color:#ff7777}.targetRow{display:flex;gap:12px;align-items:center;margin-top:14px}
.targetInput{flex:1;background:#080d13;border:2px solid #303b48;color:white;border-radius:20px;text-align:center;font-size:34px;padding:16px;width:100%}
.small{width:105px;font-size:34px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.reset{background:#a52222}.info{font-size:16px;color:#aeb9c7;line-height:1.5}.ok{color:#55df7a}.bad{color:#ff7777}
</style>
</head>
<body>
<h1>HYDFLEX – MIARKA</h1>

<div class="card">
<button class="connect" id="connectBtn">🔵 POŁĄCZ Z HYDFLEX-MIARKA</button>
<div id="status" class="status">Niepołączono</div>
</div>

<div class="card">
<div class="label">ZMIERZONE</div>
<div class="value"><span id="measured">0.00</span> <span class="unit">m</span></div>
<div class="pulses">Impulsy: <span id="pulses">0</span></div>
</div>

<div class="card">
<div class="label">ZADANA DŁUGOŚĆ</div>
<div class="targetRow">
<button class="small" id="minus">−</button>
<input class="targetInput" id="target" value="10.00" inputmode="decimal">
<button class="small" id="plus">+</button>
</div>
<div class="buttons">
<button id="setBtn">USTAW</button>
<button class="reset" id="resetBtn">RESET</button>
</div>
</div>

<div class="card info">
<b>Bluetooth BLE</b><br>
Stan: <span id="bleState" class="bad">rozłączono</span><br><br>
Panel łączy się bezpośrednio z ESP32 przez Bluetooth BLE.
</div>

<script>
const SERVICE_UUID="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID="6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device=null,rx=null,tx=null;

const $=id=>document.getElementById(id);

function status(t,cls=""){
  $("status").textContent=t;
  $("status").className="status "+cls;
}

async function send(cmd){
  if(!rx){status("Brak połączenia z miarką","error");return}
  try{
    await rx.writeValue(new TextEncoder().encode(cmd));
  }catch(e){status("Błąd wysyłania: "+e.message,"error")}
}

function parseData(text){
  text.split("\n").forEach(line=>{
    line=line.trim();
    if(line.startsWith("ZMIERZONA:")){
      let v=line.substring(10).replace(" m","").replace(",",".");
      if(!isNaN(v)) $("measured").textContent=Number(v).toFixed(2);
    }
    if(line.startsWith("ZADANA:")){
      let v=line.substring(7).replace(" m","").replace(",",".");
      if(!isNaN(v)) $("target").value=Number(v).toFixed(2);
    }
    if(line.startsWith("IMPULSY:")){
      $("pulses").textContent=line.substring(8).trim();
    }
  });
}

function notification(e){
  parseData(new TextDecoder().decode(e.target.value));
}

async function connect(){
  if(!navigator.bluetooth){
    status("Ta przeglądarka nie obsługuje Web Bluetooth","error");
    return;
  }

  try{
    status("Wyszukiwanie HYDFLEX-MIARKA...");

    device=await navigator.bluetooth.requestDevice({
      filters:[{name:"HYDFLEX-MIARKA"}],
      optionalServices:[SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected",()=>{
      rx=null;tx=null;
      $("bleState").textContent="rozłączono";
      $("bleState").className="bad";
      status("Bluetooth rozłączono","error");
    });

    status("Łączenie...");
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);

    rx=await service.getCharacteristic(RX_UUID);
    tx=await service.getCharacteristic(TX_UUID);

    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged",notification);

    $("bleState").textContent="POŁĄCZONO";
    $("bleState").className="ok";
    status("Połączono z HYDFLEX-MIARKA","connected");

    await send("RESET");
  }catch(e){
    console.error(e);
    status("Nie udało się połączyć: "+e.message,"error");
    $("bleState").textContent="błąd";
    $("bleState").className="bad";
  }
}

$("connectBtn").onclick=connect;
$("plus").onclick=()=>send("PLUS");
$("minus").onclick=()=>send("MINUS");
$("resetBtn").onclick=()=>send("RESET");

$("setBtn").onclick=()=>{
  let v=$("target").value.replace(",",".");
  if(v==="" || isNaN(v)){
    status("Podaj prawidłową długość","error");
    return;
  }
  send("TARGET:"+Number(v).toFixed(2));
};

$("target").addEventListener("keydown",e=>{
  if(e.key==="Enter") $("setBtn").click();
});
</script>
</body>
</html>
